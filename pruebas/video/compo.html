<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Y Altoque · presentación</title>
<!-- Composición del vídeo de presentación (50 s, 1920x1080, 30 fps). Un reloj
     maestro activa cada escena por tiempo; los clips del portal (clips/*.mp4,
     grabados con grabar-clips.sh) van dentro de un marco de pantalla, y la
     intro y el cierre son estrellas, el astronauta y letras que entran.
     Con ?auto=1 espera a que carguen los vídeos, arranca y al llegar a 50 s pone
     el título "FIN" (así lo detecta quien graba). Con ?t=12 se queda quieto en
     ese segundo, para revisar un fotograma. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#d0a55c; --gold-bright:#e9c57c; --lavanda:#8d86e8; --menta:#4fc9a3; --coral:#e5566f;
    --ease-expo:cubic-bezier(.16,1,.3,1); --ease-out:cubic-bezier(.22,.9,.3,1) }
  html,body{margin:0;background:#0b0b0c;color:#f5f5f7;font-family:Inter,system-ui,sans-serif;overflow:hidden}
  #lienzo{position:relative;width:1920px;height:1080px;overflow:hidden;background:#0b0b0c}
  #estrellas{position:absolute;inset:0}
  .nebula{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 600ms ease}
  #lienzo.rodando .nebula{opacity:1}
  .nebulaBase{
    background:radial-gradient(60% 50% at 70% 40%, rgba(141,134,232,.18), transparent 70%),
               radial-gradient(45% 40% at 25% 70%, rgba(208,165,92,.14), transparent 70%)}
  .escena{position:absolute;inset:0;display:none}
  .escena.on{display:block}
  .escena.off{animation:empuja 220ms var(--ease-out) forwards}
  @keyframes empuja{to{opacity:0;transform:scale(.96)}}

  /* ── Marco de pantalla con el clip ─────────────────────────────────── */
  .marco{position:absolute;left:160px;top:120px;width:1600px;height:900px;border-radius:26px;overflow:hidden;
    background:#131315;box-shadow:0 40px 90px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.06), inset 0 1px 0 rgba(255,255,255,.08);
    transform-origin:50% 60%}
  .on .marco{animation:llega 620ms var(--ease-expo) both}
  @keyframes llega{from{opacity:0;transform:scale(1.04) translateY(10px)}to{opacity:1;transform:none}}
  .marco video{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
  .marco::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:26px;
    background:linear-gradient(180deg, transparent 72%, rgba(11,11,12,.92) 100%)}

  /* ── Rótulos: capítulo arriba, título y explicación abajo ──────────── */
  .cap{position:absolute;left:160px;top:62px;font-size:18px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-bright);opacity:0}
  .on .cap{animation:asoma 480ms var(--ease-expo) 200ms both}
  @keyframes asoma{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .texto{position:absolute;left:160px;bottom:84px;max-width:1500px}
  .titulo{font-family:"Bricolage Grotesque",Inter,sans-serif;font-size:86px;font-weight:700;letter-spacing:-.03em;line-height:1;margin:0 0 14px;
    font-variation-settings:"opsz" 96}
  .titulo .l{display:inline-block;overflow:hidden;vertical-align:bottom}
  .titulo .l i{display:inline-block;font-style:normal;transform:translateY(110%)}
  .on .titulo .l i{animation:letra 560ms var(--ease-expo) calc(var(--i) * 24ms + 120ms) both}
  @keyframes letra{to{transform:none}}
  .titulo .l.esp{width:.28em}
  .sub{font-size:30px;font-weight:400;color:#c9c9cf;margin:0;line-height:1.3;max-width:26ch}
  .sub .w{display:inline-block;opacity:0;transform:translateY(10px);margin-right:.26em}
  .on .sub .w{animation:palabra 480ms var(--ease-expo) calc(var(--i) * 34ms + 520ms) both}
  @keyframes palabra{to{opacity:1;transform:none}}
  .texto.centro{left:0;right:0;bottom:auto;top:50%;transform:translateY(-50%);text-align:center;max-width:none}
  .texto.centro .sub{max-width:none;margin-inline:auto}

  /* ── Intro: el astronauta cruza y el logo sube ─────────────────────── */
  .astro{position:absolute;width:420px;left:-460px;top:560px;filter:drop-shadow(0 30px 40px rgba(0,0,0,.7))}
  .on .astro{animation:cruza 4.6s cubic-bezier(.3,.6,.4,1) both}
  @keyframes cruza{from{transform:translate(0,0) rotate(6deg)}to{transform:translate(2400px,-520px) rotate(-8deg)}}
  .logo{font-family:"Bricolage Grotesque",Inter,sans-serif;font-size:150px;font-weight:700;letter-spacing:-.04em;line-height:1;margin:0 0 18px}
  .logo .y{color:var(--gold)}
  .lema{font-size:40px;color:#c9c9cf;margin:0}
  .intro .texto{top:46%}
  .intro .titulo{font-size:150px}
  .cierre .astro{left:auto;right:140px;top:300px;width:360px;animation:none}
  .on.cierre .astro{animation:flota 5s ease-in-out infinite, asoma 700ms var(--ease-expo) both}
  @keyframes flota{0%,100%{translate:0 0}50%{translate:0 -14px}}
  .cierre .texto{left:160px;right:auto;text-align:left;transform:translateY(-50%)}
  .cierre .url{font-family:"Bricolage Grotesque",Inter,sans-serif;font-size:120px;font-weight:700;letter-spacing:-.03em}
  .pill{display:inline-block;margin-top:34px;padding:0 34px;height:84px;line-height:84px;border-radius:999px;font-size:34px;font-weight:600;
    color:#1a1206;background:#e3bd74 linear-gradient(180deg,#f3d48f,#d9ad5b);
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35), inset 0 -4px 0 rgba(110,70,15,.45), 0 16px 30px -12px rgba(0,0,0,.7);opacity:0}
  .on .pill{animation:asoma 520ms var(--ease-expo) 900ms both}

  /* ── Cámara: el clip se acerca a lo que importa y vuelve a alejarse. La
     escala va en el vídeo (el marco se queda quieto) y el origen se mueve con
     ella, así el "zoom" apunta a una zona distinta en cada escena. */
  .marco video{will-change:transform,transform-origin}
  [data-clip="login"].on video{animation:camLogin 4s cubic-bezier(.4,0,.2,1) both}
  @keyframes camLogin{from{transform:scale(1);transform-origin:50% 45%}to{transform:scale(1.28);transform-origin:50% 48%}}
  [data-clip="resumen"].on video{animation:camResumen 8s cubic-bezier(.45,0,.2,1) both}
  @keyframes camResumen{0%{transform:scale(1.35);transform-origin:30% 32%}34%{transform:scale(1.35);transform-origin:36% 34%}
    62%{transform:scale(1);transform-origin:50% 50%}100%{transform:scale(1.25);transform-origin:84% 72%}}
  [data-clip="gastos"].on video{animation:camGastos 7s cubic-bezier(.45,0,.2,1) both}
  @keyframes camGastos{0%{transform:scale(1.2);transform-origin:45% 30%}40%{transform:scale(1);transform-origin:50% 50%}100%{transform:scale(1.3);transform-origin:36% 62%}}
  [data-clip="finmes"].on video{animation:camFinmes 6s cubic-bezier(.45,0,.2,1) both}
  @keyframes camFinmes{0%{transform:scale(1);transform-origin:50% 40%}45%{transform:scale(1.35);transform-origin:62% 36%}100%{transform:scale(1.1);transform-origin:50% 40%}}
  [data-clip="movs"].on video{animation:camMovs 5s cubic-bezier(.45,0,.2,1) both}
  @keyframes camMovs{0%{transform:scale(1);transform-origin:40% 40%}100%{transform:scale(1.32);transform-origin:72% 42%}}
  [data-clip="compromisos"].on video{animation:camCompromisos 5s cubic-bezier(.45,0,.2,1) both}
  @keyframes camCompromisos{0%{transform:scale(1.3);transform-origin:40% 24%}100%{transform:scale(1);transform-origin:50% 50%}}
  [data-clip="metas"].on video{animation:camMetas 4s cubic-bezier(.45,0,.2,1) both}
  @keyframes camMetas{0%{transform:scale(1);transform-origin:50% 40%}100%{transform:scale(1.28);transform-origin:40% 32%}}
  [data-clip="pro"].on video{animation:camPro 3.5s cubic-bezier(.45,0,.2,1) both}
  @keyframes camPro{0%{transform:scale(1.25);transform-origin:50% 28%}100%{transform:scale(1.05);transform-origin:50% 36%}}
  /* Entre capítulos el astronauta cruza por delante, como barrido de corte. */
  .barrido{position:absolute;left:-520px;top:300px;width:440px;pointer-events:none;opacity:0;z-index:5;filter:drop-shadow(0 30px 40px rgba(0,0,0,.7))}
  .barrido.va{animation:barre 900ms cubic-bezier(.5,0,.2,1) both}
  @keyframes barre{0%{opacity:0;transform:translate(0,120px) rotate(10deg)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translate(2600px,-260px) rotate(-12deg)}}
  #velo{position:absolute;inset:0;background:#0b0b0c;opacity:0;pointer-events:none}
</style></head>
<body><div id="lienzo">
  <canvas id="estrellas" width="1920" height="1080"></canvas>
  <div class="nebula"></div>

  <section class="escena intro" data-in="0" data-out="5">
    <img class="astro" src="../../app/astronauta.webp" alt="">
    <div class="texto centro">
      <h1 class="titulo logo" data-letras="Y Altoque"></h1>
      <p class="sub lema" data-palabras="Tu plata, en órbita."></p>
    </div>
  </section>

  <section class="escena" data-in="5" data-out="9" data-clip="login">
    <div class="cap">Entrar</div>
    <div class="marco"><video muted playsinline preload="auto" src="clips/login.mp4"></video></div>
    <div class="texto"><h2 class="titulo" data-letras="Entra en un toque"></h2>
      <p class="sub" data-palabras="Con Google o con tu correo, la misma cuenta de la app."></p></div>
  </section>

  <section class="escena" data-in="9" data-out="17" data-clip="resumen">
    <div class="cap">01 · Resumen</div>
    <div class="marco"><video muted playsinline preload="auto" src="clips/resumen.mp4"></video></div>
    <div class="texto"><h2 class="titulo" data-letras="Tu mes en órbita"></h2>
      <p class="sub" data-palabras="Cada categoría es un planeta: el más grande, donde más gastas. El cohete marca hoy."></p></div>
  </section>

  <section class="escena" data-in="17" data-out="24" data-clip="gastos">
    <div class="cap">02 · Gastos</div>
    <div class="marco"><video muted playsinline preload="auto" src="clips/gastos.mp4"></video></div>
    <div class="texto"><h2 class="titulo" data-letras="En qué se te va"></h2>
      <p class="sub" data-palabras="Mundos, columnas y dona de arcilla. Tu mes contra tu promedio, teja a teja."></p></div>
  </section>

  <section class="escena" data-in="24" data-out="30" data-clip="finmes">
    <div class="cap">03 · Fin de mes</div>
    <div class="marco"><video muted playsinline preload="auto" src="clips/finmes.mp4"></video></div>
    <div class="texto"><h2 class="titulo" data-letras="¿Llegas a fin de mes?"></h2>
      <p class="sub" data-palabras="Mueve el deslizador y toda la proyección cambia contigo."></p></div>
  </section>

  <section class="escena" data-in="30" data-out="35" data-clip="movs">
    <div class="cap">04 · Movimientos</div>
    <div class="marco"><video muted playsinline preload="auto" src="clips/movs.mp4"></video></div>
    <div class="texto"><h2 class="titulo" data-letras="Cada gasto, una teja"></h2>
      <p class="sub" data-palabras="Tócala y te cuenta su historia: cuántas veces, cuánto pesa."></p></div>
  </section>

  <section class="escena" data-in="35" data-out="40" data-clip="compromisos">
    <div class="cap">05 · Compromisos</div>
    <div class="marco"><video muted playsinline preload="auto" src="clips/compromisos.mp4"></video></div>
    <div class="texto"><h2 class="titulo" data-letras="Lo fijo del mes"></h2>
      <p class="sub" data-palabras="Día por día: lo pagado, lo que viene y lo que te deben."></p></div>
  </section>

  <section class="escena" data-in="40" data-out="44" data-clip="metas">
    <div class="cap">06 · Metas</div>
    <div class="marco"><video muted playsinline preload="auto" src="clips/metas.mp4"></video></div>
    <div class="texto"><h2 class="titulo" data-letras="De la billetera al trofeo"></h2>
      <p class="sub" data-palabras="Cuota a cuota, con la próxima siempre a la vista."></p></div>
  </section>

  <section class="escena" data-in="44" data-out="47.5" data-clip="pro">
    <div class="cap">07 · Planes</div>
    <div class="marco"><video muted playsinline preload="auto" src="clips/pro.mp4"></video></div>
    <div class="texto"><h2 class="titulo" data-letras="Gratis para empezar"></h2>
      <p class="sub" data-palabras="Pro para ir más lejos."></p></div>
  </section>

  <section class="escena cierre" data-in="47.5" data-out="50.5">
    <img class="astro" src="../../app/astronauta.webp" alt="">
    <div class="texto centro">
      <h2 class="titulo url" data-letras="yaltoque.com"></h2>
      <p class="sub" data-palabras="Tu plata, en órbita."></p>
      <span class="pill">Empieza hoy</span>
    </div>
  </section>
  <img class="barrido" id="barrido" src="../../app/astronauta.webp" alt="">
  <div id="velo"></div>
</div>
<script>
// ── Letras y palabras: cada una en su span con su índice para el escalonado.
for (const el of document.querySelectorAll("[data-letras]")){
  const txt = el.dataset.letras; let i = 0;
  el.innerHTML = [...txt].map((ch) => ch === " " ? `<span class="l esp"></span>`
    : `<span class="l"><i style="--i:${i++}">${ch === "Y" && el.classList.contains("logo") ? '<b class="y">Y</b>' : ch}</i></span>`).join("");
}
for (const el of document.querySelectorAll("[data-palabras]"))
  el.innerHTML = el.dataset.palabras.split(" ").map((w, i) => `<span class="w" style="--i:${i}">${w}</span>`).join("");

// ── Estrellas con paralaje lento; se apagan en el cierre.
const cv = document.getElementById("estrellas"), g = cv.getContext("2d");
let semilla = 7; const rnd = () => (semilla = (semilla * 16807) % 2147483647) / 2147483647;
const estrellas = Array.from({ length: 320 }, () => ({ x: rnd() * 1920, y: rnd() * 1080, r: .4 + rnd() * 1.6, z: .2 + rnd() * .8, p: rnd() * 6.28 }));
function pintarEstrellas(t, brillo = 1){
  g.clearRect(0, 0, 1920, 1080);
  for (const e of estrellas){
    const x = (e.x + t * 6 * e.z) % 1920, tw = .6 + .4 * Math.sin(t * 1.4 + e.p);
    g.globalAlpha = brillo * tw * (.35 + e.z * .65); g.fillStyle = e.z > .8 ? "#fff6dc" : "#dcdcea";
    g.beginPath(); g.arc(x, e.y, e.r, 0, 6.283); g.fill();
  }
  g.globalAlpha = 1;
}

// ── Reloj maestro: activa y desactiva escenas, arranca sus clips.
const escenas = [...document.querySelectorAll(".escena")].map((el) => ({ el, in: +el.dataset.in, out: +el.dataset.out, video: el.querySelector("video"), estado: "fuera" }));
const CORTES_CON_ASTRO = new Set(["resumen", "finmes", "compromisos"]);   // tres barridos en 50 s, no uno por corte
const DURACION = 50, OFFSET = 0;   // los mp4 ya vienen sin el segundo en blanco del arranque (ver grabar-clips.sh)
function estado(t){
  for (const s of escenas){
    const dentro = t >= s.in && t < s.out;
    if (dentro && s.estado !== "dentro"){
      s.el.classList.remove("off"); s.el.classList.add("on"); s.estado = "dentro";
      if (s.video){ s.video.currentTime = OFFSET; s.video.play().catch(() => {}); }
    } else if (!dentro && s.estado === "dentro"){
      s.estado = "saliendo"; s.el.classList.add("off");
      if (s.video && CORTES_CON_ASTRO.has(s.el.dataset.clip)){ const b = document.getElementById("barrido"); b.classList.remove("va"); void b.offsetWidth; b.classList.add("va"); }
      setTimeout(() => { s.el.classList.remove("on", "off"); s.estado = "fuera"; s.video?.pause(); }, 230);
    }
  }
  pintarEstrellas(t, t > 48.5 ? Math.max(0, 1 - (t - 48.5) / 1.5) : 1);
  document.getElementById("velo").style.opacity = t > 49.2 ? Math.min(1, (t - 49.2) / .8) : 0;
}
const q = new URLSearchParams(location.search);
function arrancar(){
  document.getElementById("lienzo").classList.add("rodando");   // hasta aquí el lienzo es negro puro: así se encuentra el arranque en la grabación
  const t0 = performance.now();
  const ciclo = () => {
    const t = (performance.now() - t0) / 1000;
    estado(t);
    if (t >= DURACION + .4){ document.title = "FIN"; return; }
    requestAnimationFrame(ciclo);
  };
  requestAnimationFrame(ciclo);
}
const videos = [...document.querySelectorAll("video")];
const listos = Promise.all(videos.map((v) => new Promise((ok) => { if (v.readyState >= 3) ok(); else { v.addEventListener("canplaythrough", ok, { once: true }); setTimeout(ok, 9000); } })));
if (q.has("t")){
  // Fotograma fijo para revisar: se reproduce de verdad desde el arranque de la
  // escena que toca (el servidor de pruebas no admite rangos, así que no se
  // puede buscar dentro del clip) y se congela todo al llegar al segundo pedido.
  const t = +q.get("t"), desde = escenas.filter((s) => t >= s.in).map((s) => s.in).pop() || 0;
  listos.then(() => {
    const t0 = performance.now() - desde * 1000;
    const ciclo = () => {
      const ahora = (performance.now() - t0) / 1000;
      if (ahora >= t){
        estado(t);
        for (const s of escenas) s.video?.pause();
        document.getAnimations().forEach((a) => a.pause());
        document.title = "QUIETO"; return;
      }
      estado(ahora); requestAnimationFrame(ciclo);
    };
    requestAnimationFrame(ciclo);
  });
} else if (q.has("auto")){
  listos.then(() => { document.title = "RODANDO"; arrancar(); });
} else {
  listos.then(() => { document.body.addEventListener("click", arrancar, { once: true }); pintarEstrellas(0); });
}
</script></body></html>
