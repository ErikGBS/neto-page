<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#080b12">
<title>Y Altoque</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="canonical" href="https://yaltoque.com/app/">
<style>
  body{background:#080b12;color:#8893a6;min-height:100vh;margin:0;display:flex;
    align-items:center;justify-content:center;text-align:center;padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  a{color:#f3ce7f}
</style>
</head>
<body>
<p>El panel vive ahora dentro de <a href="/app/#pagos">yaltoque.com/app/</a>, con el
resto de tu cuenta. Te llevamos...</p>
<script>
// El panel admin se mudó a /app/, donde aparece solo si el backend reconoce tu
// correo como el del admin. Esta página queda de puente por los enlaces
// guardados; el hash viejo se traduce al nuevo nombre de la sección.
const SECCION = { "#pagos":"#pagos", "#resumen":"#ad-resumen", "#crecimiento":"#ad-crecimiento",
                  "#uso":"#ad-uso", "#usuarios":"#ad-usuarios" };
location.replace("/app/" + (SECCION[location.hash] || "#pagos"));
</script>
</body>
